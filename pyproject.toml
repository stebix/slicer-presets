[project]
name = "slicer-presets"
version = "0.2.0"
description = "JSON-defined Segment Editor presets for 3D Slicer: startup hook, scene-import crash guard, scene sanitiser and launcher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/stebix/slicer-presets"
Issues = "https://github.com/stebix/slicer-presets/issues"

[project.scripts]
slicer-presets = "slicer_presets.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
